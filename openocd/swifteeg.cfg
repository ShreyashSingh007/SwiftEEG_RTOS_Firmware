# SwiftEEG — ST-Link V2 over SWD to nRF52840.
#
# Flash:  openocd -f openocd/swifteeg.cfg -c "program build/zephyr/zephyr.hex verify reset exit"
# Debug:  openocd -f openocd/swifteeg.cfg     (then connect gdb to :3333)
#
# ST-Link V2 clones vary. If the adapter is not found, check `lsusb`/Device
# Manager and swap stlink.cfg for stlink-v2.cfg.

source [find interface/stlink.cfg]
transport select hla_swd

source [find target/nrf52.cfg]

# ST-Link V2 tops out well below the nRF52840's SWD ceiling.
adapter speed 1000

# RTT: the only log path on this board (no spare UART).
# After `reset halt`, locate the control block and start the server:
#   rtt setup 0x20000000 0x40000 "SEGGER RTT"
#   rtt start
#   rtt server start 9090 0
# Then: telnet localhost 9090
