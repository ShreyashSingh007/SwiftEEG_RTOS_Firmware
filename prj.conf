# ---- M1: bring-up only. Streaming, DSP and SD arrive in M2/M4. ----

# Logging over RTT (no spare UART on this board)
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096

CONFIG_GPIO=y
CONFIG_SPI=y

# Sensors
CONFIG_SENSOR=y

# Enough stack for bring-up logging
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Fault diagnosis while bringing hardware up
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_THREAD_NAME=y
CONFIG_ASSERT=y
