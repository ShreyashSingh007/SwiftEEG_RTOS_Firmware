CONFIG_ZTEST=y

# Hardware FPU: the DSP path is float32 and must be tested the way it runs.
CONFIG_FPU=y

# Results go out over RTT - this board has no spare UART.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y

# Golden vector arrays are large and live on the test thread's stack frame.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192
