# Attach RTT and serve it on TCP 9090.
#
# RTT is the only log path on this board - no UART is spare.
#
#   openocd -f openocd/swifteeg.cfg -f openocd/rtt.cfg
#   then, in another shell:  telnet localhost 9090
#
# Three things this script works around:
#
#  1. The control block is located while the target is HALTED. Once the BLE
#     controller (MPSL) is running it takes the bus for radio timing, and
#     background memory reads over the HLA transport become unreliable -
#     the search then fails with "no control block found" even though the
#     block is present. Halting first makes it deterministic.
#
#  2. nRESET (J4 pin 2) MUST be wired to the probe's RST pin. swifteeg.cfg
#     connects with reset asserted, so the core is caught before firmware
#     runs - without that, BLE firmware locks the debugger out entirely.
#
#  3. The target is resumed only after the block is found, so firmware that
#     has not yet reached main() is given the chance to initialise RTT.

init

# No reset here. The ST-Link's SRST does not reliably drive nRESET on this
# board - `reset halt` and `reset run` both time out - so the firmware is
# left running from whenever it last started, and we simply halt to look at
# it. Memory reads are only dependable with the core stopped.
halt
rtt setup 0x20000000 0x40000 "SEGGER RTT"
rtt start

resume
rtt server start 9090 0
