# ---- M1: bring-up only. Streaming, DSP and SD arrive in M2/M4. ----

# Logging over RTT (no spare UART on this board)
CONFIG_LOG=y
# Immediate, NOT deferred. Deferred logging is flushed by a background
# thread, which never runs after a fatal error with interrupts disabled -
# so panics are silently lost, which is precisely when the log matters most.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BUFFER_SIZE=4096
# Info level. Level 4 floods the log with kernel/MPU tracing.
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_GPIO=y
CONFIG_SPI=y

# Sensors
CONFIG_SENSOR=y

# SAADC, for the VDD rail measurement
CONFIG_ADC=y

# Enough stack for bring-up logging
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Fault diagnosis while bringing hardware up
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_THREAD_NAME=y
CONFIG_ASSERT=y
