# ---- M1: bring-up only. Streaming, DSP and SD arrive in M2/M4. ----

# Logging over RTT (no spare UART on this board)
CONFIG_LOG=y
# Immediate, NOT deferred. Deferred logging is flushed by a background
# thread, which never runs after a fatal error with interrupts disabled -
# so panics are silently lost, which is precisely when the log matters most.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BUFFER_SIZE=4096

# The SEGGER RTT up-buffer defaults to 1 KB and DROPS on overflow in skip
# mode, so boot output was being silently cut off at exactly 1023 bytes -
# right where the USB init messages are. Give it real room.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
# Info level. Level 4 floods the log with kernel/MPU tracing.
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_GPIO=y
CONFIG_SPI=y

# Sensors
CONFIG_SENSOR=y

# SAADC, for the VDD rail measurement
CONFIG_ADC=y

# Enough stack for bring-up logging
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Fault diagnosis while bringing hardware up
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_THREAD_NAME=y
CONFIG_ASSERT=y

# ---- USB (current usbd stack; the legacy one is DEPRECATED) ----
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_HWINFO=y

# CDC ACM is a serial driver, so SERIAL must be on even though this board
# has no physical UART. The board defconfig disables it; re-enable here.
# Without this USBD_CDC_ACM_CLASS silently stays off and the CDC device
# never gets instantiated (link fails on a missing device ordinal).
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# Stack sizes for the USB threads.
#
# The nRF UDC driver thread defaults to 512 bytes, which is NOT enough here:
# CONFIG_LOG_MODE_IMMEDIATE formats log messages inline on the calling
# thread's stack, and any logging from the USB path blows straight through
# it. The symptom is brutal and misleading - an MPU fault with
# "Stack overflow ... Current thread: udc_nrfx", the system halts, and from
# the host side USB looks like a dead cable: the device asserts its D+
# pullup, the host sees an attach, and then nothing answers the descriptor
# request ("USB device not recognized").
CONFIG_UDC_NRF_THREAD_STACK_SIZE=2048
CONFIG_USBD_THREAD_STACK_SIZE=2048

# ---- BLE ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SwiftEEG"
CONFIG_BT_DEVICE_APPEARANCE=0

# 2M PHY and Data Length Extension: together these are what make
# 8ch @ 1 kSPS fit over BLE with headroom.
CONFIG_BT_PHY_UPDATE=y
# Required for the bt_conn_le_phy_update() API; BT_PHY_UPDATE alone only
# permits controller-initiated updates.
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Large ATT MTU so a sample packet is one notification, not a reassembly.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_ATT_PREPARE_COUNT=2

CONFIG_BT_GATT_DYNAMIC_DB=n
CONFIG_BT_MAX_CONN=1
