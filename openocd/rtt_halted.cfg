# Read buffered RTT output with the core HALTED, and leave it halted.
#
# Use when `rtt.cfg` reports "Failed to read from up-channel 0": RTT reads
# race the running target over the ST-Link HLA transport and fail
# intermittently. The log text is already sitting in the RAM ring buffer, so
# stopping the core first makes retrieval deterministic.
#
# The target stays halted afterwards - resume it separately, or reflash.
#
#   openocd -f openocd/swifteeg.cfg -f openocd/rtt_halted.cfg
#   telnet localhost 9090

init
halt

rtt setup 0x20000000 0x40000 "SEGGER RTT"
rtt start
rtt server start 9090 0
