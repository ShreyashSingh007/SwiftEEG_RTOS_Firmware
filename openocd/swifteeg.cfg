# SwiftEEG - ST-Link V2 over SWD to nRF52840 (Raytac MDBT50Q-1MV2).
#
# Wiring to header J4:  1=GND  2=nRESET  3=SWDIO  4=SWDCLK
#
# ---------------------------------------------------------------------------
# Adapter mode: HLA, chosen empirically.
#
# This ST-Link V2 (STLINK V2J46S7, VID:PID 0483:3748) does NOT work in
# DAP-direct mode. `transport select swd` fails at connect with ST-Link
# status 0x0b (SWD_DP_FAULT) and never reads DPIDR. Legacy HLA connects
# first try and examines the core cleanly.
#
# Consequence, and it matters:
#   HLA cannot reach the CTRL-AP, so `nrf52_recover` DOES NOT WORK here.
#   => NEVER enable UICR APPROTECT on this board. If it ever gets locked,
#      this probe cannot unlock it and the Raspberry Pi 5 bit-banging raw
#      SWD is the only way back.
#
# The chip was verified unlocked on first probe (Cortex-M4 r0p1 detected,
# examination succeeded), so recovery is not needed for normal work.
#
# Note interface/stlink.cfg is DAP-only in OpenOCD 0.12+; HLA now needs
# interface/stlink-hla.cfg.
# ---------------------------------------------------------------------------

source [find interface/stlink-hla.cfg]
transport select hla_swd

# Connect with reset asserted.
#
# Without this, firmware that runs the BLE controller locks the debugger out
# completely: MPSL holds the bus for radio timing and SWD connection attempts
# fail 100% of the time, so the board cannot even be reflashed. Asserting
# nRESET while connecting halts the core before any firmware runs, which is
# the standard - and here the only - recovery.
#
# This requires J4 pin 2 (nRESET) wired to the probe's RST pin. It is not
# optional on this board.
reset_config srst_only srst_nogate connect_assert_srst

# Vendor configs live under a subdirectory in OpenOCD 0.12+.
source [find target/nordic/nrf52.cfg]

# SWD clock. Measured on this hardware - the result is counterintuitive,
# so do not "helpfully" slow this down:
#
#   1800 kHz  2/3      480 kHz  1/3
#   1200 kHz  6/6      240 kHz  0/3
#    950 kHz  6/6      125 kHz  0/3
#
# Slower is WORSE, which rules out ringing/signal integrity. The likely
# cause is the nRF52 debug interface losing the core between slow
# transactions on a blank chip that faults on its empty vector table.
# 950 kHz sits in the reliable band with margin below the 1800 kHz rolloff.
adapter speed 950

# ---------------------------------------------------------------------------
# Usage
#
#   Probe only (confirm the chip is alive and not locked):
#     openocd -f openocd/swifteeg.cfg -c "init; targets; exit"
#
#   Flash:
#     openocd -f openocd/swifteeg.cfg \
#       -c "program build/zephyr/zephyr.hex verify reset exit"
#
#   RTT logs (the only log path - no spare UART on this board):
#     openocd -f openocd/swifteeg.cfg \
#       -c "init; reset halt; rtt setup 0x20000000 0x40000 \"SEGGER RTT\"; \
#           rtt start; rtt server start 9090 0; resume"
#     then: telnet localhost 9090
# ---------------------------------------------------------------------------
