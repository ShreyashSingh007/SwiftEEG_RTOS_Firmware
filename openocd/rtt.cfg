# Attach RTT and serve it on TCP 9090.
#
# RTT is the only log path on this board - no UART is spare.
#
#   openocd -f openocd/swifteeg.cfg -f openocd/rtt.cfg
#   then, in another shell:  telnet localhost 9090
#
# Two things this script works around:
#
#  1. `init` halts the core. It is resumed before searching for the control
#     block, otherwise the search can race a target that has not reached
#     main() yet and fail with "rtt: No control block found".
#
#  2. `reset run` is NOT used: nRESET is deliberately not wired to the probe,
#     so OpenOCD has no SRST line and the reset fails. Resuming is enough -
#     the firmware has been running since it was flashed.

init
catch { resume }
sleep 800

# Scan RAM (0x20000000, 256 KB) for the marker the firmware places there.
rtt setup 0x20000000 0x40000 "SEGGER RTT"
rtt start
rtt server start 9090 0
