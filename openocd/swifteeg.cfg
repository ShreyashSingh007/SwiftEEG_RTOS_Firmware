# SwiftEEG - ST-Link V2 over SWD to nRF52840 (Raytac MDBT50Q-1MV2).
#
# Wiring to header J4:  1=GND  2=nRESET  3=SWDIO  4=SWDCLK
#
# ---------------------------------------------------------------------------
# Adapter mode matters on this target.
#
# The nRF52840 can ship with APPROTECT enabled, which locks the debug port
# until a mass erase is issued over the CTRL-AP. Reaching CTRL-AP needs raw
# DAP access:
#
#   transport select swd      -> raw DAP -> `nrf52_recover` WORKS  (preferred)
#   transport select hla_swd  -> HLA     -> `nrf52_recover` FAILS
#
# DAP mode needs ST-Link firmware V2J28 or newer. If OpenOCD reports the
# adapter does not support it, comment the two lines below and uncomment the
# HLA block - but note a locked chip then cannot be recovered with this probe,
# and the Raspberry Pi 5 bit-banging raw SWD is the fallback.
# ---------------------------------------------------------------------------

source [find interface/stlink.cfg]
transport select swd

# --- HLA fallback (older ST-Link firmware) ---
# transport select hla_swd

# Vendor configs live under a subdirectory in OpenOCD 0.12+.
source [find target/nordic/nrf52.cfg]

# ST-Link tops out well below the nRF52840's SWD ceiling. Raise once stable.
adapter speed 1000

# ---------------------------------------------------------------------------
# Usage
#
#   Probe only (confirm the chip is alive and not locked):
#     openocd -f openocd/swifteeg.cfg -c "init; targets; exit"
#
#   Unlock a locked chip (mass erase - destroys all flash):
#     openocd -f openocd/swifteeg.cfg -c "init; nrf52_recover; exit"
#
#   Flash:
#     openocd -f openocd/swifteeg.cfg \
#       -c "program build/zephyr/zephyr.hex verify reset exit"
#
#   RTT logs (the only log path - no spare UART on this board):
#     openocd -f openocd/swifteeg.cfg \
#       -c "init; reset halt; rtt setup 0x20000000 0x40000 \"SEGGER RTT\"; \
#           rtt start; rtt server start 9090 0; resume"
#     then: telnet localhost 9090
# ---------------------------------------------------------------------------
