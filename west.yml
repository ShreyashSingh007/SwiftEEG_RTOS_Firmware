# SwiftEEG firmware — west manifest (T2 "application" topology).
#
# Pinned to the NCS version installed on this machine (nrfutil sdk-manager).
# Build reuses that shared workspace directly (see README §4) rather than
# `west update`-ing a second copy here — this manifest exists so a fresh
# machine or CI can `west init -l swifteeg` and get the same SDK version.
manifest:
  remotes:
    - name: nrfconnect
      url-base: https://github.com/nrfconnect

  projects:
    - name: sdk-nrf
      remote: nrfconnect
      revision: v3.4.0
      import: true

  self:
    path: swifteeg
