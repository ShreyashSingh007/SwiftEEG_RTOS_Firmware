# Diagnostic overlay: everything except BLE.
#
# Once MPSL and the radio are running they hold the bus for radio timing, and
# RTT reads over the ST-Link HLA transport become unreliable - the debug
# connection drops mid-session with "jtag status contains invalid mode value".
# Turning BLE off is the only way to get trustworthy logs with this probe.
#
#   .\tools\build.ps1 -NoBle
CONFIG_BT=n
